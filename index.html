<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>釜山・APIEMS 2026 旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===== 色彩（釜山版） ===== */
:root{
  --port:#23406B;      /* 釜山港藍 */
  --fishcake:#D9482F;  /* 魚糕紅 */
  --gamcheon:#F2B441;  /* 甘川黃 */
  --dongbaek:#E58FA6;  /* 冬柏粉 */
  --songdo:#2F7D6B;    /* 松島綠 */
  --haeundae:#7FB9D6;  /* 海雲台藍 */
  --bg:#EEF4F3;
  --card:#FFFFFF;
  --line:1.5px solid var(--port);
  --r:16px;
  --spot:#E3F0F7; --food:#FDF1D8; --shop:#FBE6EC; --base:#F1F3F5; --conf:#E5F0EC;
  --ink:#1D2B3A; --muted:#5B6878;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
h1,h2,h3{line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--port)}
.card{background:var(--card);border:var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;line-height:1.6;vertical-align:middle;white-space:nowrap}
.tag.sample{color:var(--fishcake);background:#fff}
.tag.must{color:#fff;background:var(--fishcake);border-color:var(--fishcake)}
.tag.todo{color:#8a5a00;background:#FFF6E0}
.tag.who{color:#fff;background:var(--songdo);border-color:var(--songdo)}
.tag.rain{color:var(--port);background:#E3F0F7}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;color:var(--port);margin:22px 0 4px}
.sec-title::before{content:"";width:10px;height:22px;border-radius:4px;background:var(--fishcake)}

/* ===== 首頁 ===== */
.hero{background:#fff;border:var(--line);border-radius:var(--r);overflow:hidden}
.hero svg{display:block;width:100%;height:auto}
.hero-text{padding:14px 16px 16px}
.hero-text .kicker{font-size:14px;color:var(--songdo);font-weight:700;letter-spacing:.08em}
.hero-text h1{font-size:26px;font-weight:900;color:var(--port);margin-top:2px}
.hero-text p{margin:4px 0 0;color:var(--muted)}

/* ===== 導覽 ===== */
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px;scroll-margin-top:12px}
.nav button{min-height:72px;background:#fff;border:var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;font-size:15px;font-weight:700;color:var(--port)}
.nav button svg{width:26px;height:26px}
.nav button[aria-selected="true"]{background:var(--port);color:#fff}
.nav button:focus-visible,.btn:focus-visible,.day-btn:focus-visible{outline:3px solid var(--gamcheon);outline-offset:2px}
.panel[hidden]{display:none}
.back{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:56px;margin-top:22px;background:#fff;border:var(--line);border-radius:var(--r);font-weight:700;color:var(--port)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 14px;border-radius:12px;border:var(--line);background:#fff;font-weight:700;color:var(--port);text-decoration:none;font-size:15px}
.btn.solid{background:var(--port);color:#fff}
.btn.sm{min-height:38px;padding:4px 10px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ===== 倒數 ===== */
.count{display:flex;gap:8px;margin-top:8px}
.count div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:8px 0}
.count b{display:block;font-size:30px;font-weight:900;color:var(--port);line-height:1.2}
.count span{font-size:14px;color:var(--muted)}
.next-box{margin-top:10px;padding:10px 12px;border-radius:12px;background:#FDF1D8}

/* ===== 登機證 ===== */
.pass{background:#fff;border:var(--line);border-radius:var(--r);margin:14px 0;overflow:hidden}
.pass-head{display:flex;justify-content:space-between;align-items:center;background:var(--port);color:#fff;padding:10px 16px;font-weight:700}
.pass-head .dir{background:var(--gamcheon);color:var(--port);border-radius:999px;padding:0 10px;font-size:14px}
.pass-body{padding:14px 16px 6px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pass-body .code{font-size:32px;font-weight:900;color:var(--port);line-height:1.1}
.pass-body .right{text-align:right}
.pass-body .time{font-size:20px;font-weight:700}
.pass-mid{text-align:center;color:var(--muted);font-size:14px}
.pass-mid svg{width:56px;height:20px;display:block;margin:0 auto}
.pass-cut{border-top:2px dashed #b8c4cf;margin:10px 16px 0;position:relative}
.pass-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 16px 14px;font-size:14px}
.pass-foot b{display:block;font-size:16px;color:var(--ink)}
.pass-foot span{color:var(--muted)}

/* ===== 每日行程 ===== */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.day-btn{flex:0 0 auto;scroll-snap-align:start;min-width:84px;min-height:72px;background:#fff;border:var(--line);border-radius:14px;padding:6px 8px;text-align:center;line-height:1.3}
.day-btn b{display:block;font-size:18px;color:var(--port)}
.day-btn span{font-size:13px;color:var(--muted)}
.day-btn[aria-selected="true"]{background:var(--port)}
.day-btn[aria-selected="true"] b,.day-btn[aria-selected="true"] span{color:#fff}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px;margin:0 -2px}
.sum{background:#fff;border:var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.sum .wicon{font-size:36px;line-height:1;grid-row:span 2}
.sum .temps{font-weight:700}
.sum .temps .hi{color:var(--fishcake)} .sum .temps .lo{color:var(--port)}
.sum .wear{grid-column:1/-1;font-size:15px;background:var(--bg);border-radius:10px;padding:4px 10px}
.sum .hotel{grid-column:1/-1;font-size:15px;border-top:1px dashed #b8c4cf;padding-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sum .hotel a{font-size:14px;font-weight:700}
.sum-toggle{float:right;border:none;background:none;color:var(--port);font-size:14px;font-weight:700;padding:0 2px}
.sum.compact .wear,.sum.compact .hotel{display:none}

.mode{display:grid;grid-template-columns:1fr 1fr;border:var(--line);border-radius:14px;overflow:hidden;margin:12px 0}
.mode button{min-height:48px;border:none;background:#fff;font-weight:700;color:var(--port)}
.mode button[aria-pressed="true"]{background:var(--port);color:#fff}
.day-head{margin:6px 0 4px}
.day-head h2{font-size:21px;color:var(--port)}
.day-note{font-size:15px;background:#fff;border-left:4px solid var(--gamcheon);border-radius:8px;padding:8px 12px;margin:8px 0}

.tl{position:relative;margin-top:10px}
.item{border:var(--line);border-radius:var(--r);padding:12px 14px;position:relative}
.item.spot{background:var(--spot)} .item.food{background:var(--food)} .item.shop{background:var(--shop)} .item.base{background:var(--base)} .item.conf{background:var(--conf)}
.item .top{display:flex;align-items:flex-start;gap:10px}
.item .t{font-weight:900;color:var(--port);font-size:17px;min-width:48px}
.item h3{font-size:18px;font-weight:700}
.item .kind{font-size:13px;color:var(--muted);font-weight:700}
.item .desc{margin:6px 0 0}
.item dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:15px}
.item dt{color:var(--muted);font-weight:700;white-space:nowrap}
.item dd{margin:0}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.item.done{opacity:.62}
.item.done h3{text-decoration:line-through}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 10px;border-radius:12px;border:var(--line);background:#fff;font-weight:700;color:var(--port);font-size:14px}
.chk .box{width:20px;height:20px;border:2px solid var(--port);border-radius:6px;display:grid;place-items:center}
.item.done .chk{background:var(--songdo);color:#fff;border-color:var(--songdo)}
.item.done .chk .box{border-color:#fff}
.rainbox{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff;border:1.5px dashed var(--port);font-size:15px}

.move{margin:0 0 0 26px;border-left:3px dotted var(--port);padding:8px 0 8px 18px;position:relative;font-size:15px}
.move::before{content:"";position:absolute;left:-8px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;background:var(--gamcheon);border:2px solid var(--port)}
.move .mv{background:#fff;border-radius:12px;padding:6px 10px;border:1px solid #c9d4de}
.move .mv b{color:var(--port)}
.move .mv .walk{color:var(--songdo);font-weight:700}
.mvtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.mvtabs button{min-height:36px;padding:2px 12px;border-radius:999px;border:1.5px solid var(--port);background:#fff;color:var(--port);font-size:14px;font-weight:700}
.mvtabs button[aria-pressed="true"]{background:var(--port);color:#fff}

.anim-in{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ===== 花費 ===== */
.exp-form{display:grid;grid-template-columns:1fr 110px auto;gap:6px;margin-top:8px}
input[type=text],input[type=number],select{font:inherit;font-size:16px;min-height:44px;border:var(--line);border-radius:12px;padding:6px 10px;background:#fff;width:100%;color:var(--ink)}
.exp-list{list-style:none;padding:0;margin:10px 0 0}
.exp-list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #c9d4de}
.exp-list li span:first-child{flex:1}
.x{border:none;background:none;color:var(--fishcake);font-size:20px;width:36px;height:36px}
.total{display:flex;justify-content:space-between;font-weight:900;color:var(--port);margin-top:8px}
.rate{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px}
.rate input{width:110px}

/* ===== 清單 ===== */
.prog{height:14px;background:var(--bg);border-radius:999px;overflow:hidden;border:1.5px solid var(--port)}
.prog i{display:block;height:100%;background:var(--songdo);width:0;transition:width .4s}
.cl{list-style:none;padding:0;margin:8px 0 0}
.cl li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #c9d4de}
.cl label{flex:1;display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer}
.cl input[type=checkbox]{width:22px;height:22px;accent-color:var(--songdo);flex:0 0 auto}
.cl li.on label span{text-decoration:line-through;color:var(--muted)}
.add{display:flex;gap:6px;margin-top:10px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.kv dt{color:var(--muted);font-weight:700;white-space:nowrap}
.kv dd{margin:0}
.area h3{color:var(--port);font-size:18px}
.area ul{margin:6px 0 0;padding-left:20px}

/* ===== 插畫動態 ===== */
.wave{animation:wave 6s ease-in-out infinite alternate}
.wave2{animation:wave 8s ease-in-out infinite alternate-reverse}
@keyframes wave{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.steam{animation:steam 3.2s ease-in-out infinite;opacity:0}
.steam.s2{animation-delay:1.1s}.steam.s3{animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.blink{animation:blink 2.4s ease-in-out infinite}
.blink:nth-child(2n){animation-delay:.8s}.blink:nth-child(3n){animation-delay:1.6s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.gull{animation:gull 5s ease-in-out infinite alternate}
@keyframes gull{from{transform:translate(0,0)}to{transform:translate(14px,-6px)}}
.flower{transform-box:fill-box;transform-origin:center;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .steam{opacity:.6}
}
@media (min-width:480px){.hero-text h1{font-size:30px}}
</style>
</head>

<script>
(function(){
const D = TRIP_DATA;
/* ---------- 隱藏資料（訂位代號、地址、訂房編號）：輸入密碼解鎖 ---------- */
let S = null;
const LOCKED = {PNR:"🔒 已隱藏", ADDR:"釜山站附近（輸入密碼後顯示）", ADDRKO:"부산역", ADDRQ:"Busan Station", BK24:"🔒 已隱藏", BK19:"🔒 已隱藏"};
const R = v => (typeof v === "string" && v[0] === "@") ? ((S && S[v.slice(1)]) ?? LOCKED[v.slice(1)] ?? "") : v;
async function unlock(pw){
  try{
    const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(D.secret.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(D.secret.iv)}, key, b(D.secret.data));
    S = JSON.parse(new TextDecoder().decode(out));
    return true;
  }catch(e){ return false; }
}
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("busan2026_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("busan2026_"+k, JSON.stringify(v)); }catch(e){} }
};
const WEEK = ["日","一","二","三","四","五","六"];
const TYPE = {spot:"觀光景點", food:"美食餐廳", shop:"購物", base:"交通・住宿", conf:"研討會"};
const gmap = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const nmap = q => "https://map.naver.com/p/search/" + encodeURIComponent(q);
const backBtn = `<button class="back" data-back>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>返回主選單</button>`;

$("#kicker").textContent = D.trip.kicker;
$("#tripName").textContent = D.trip.name;

/* ---------- 導覽 ---------- */
const tabs = [...document.querySelectorAll("#nav button")];
function showTab(name){
  tabs.forEach(b => b.setAttribute("aria-selected", b.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== "p-"+name);
  store.set("tab", name);
  if(name==="days") renderDay(true);
}
tabs.forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
document.addEventListener("click", e => {
  if(e.target.closest("[data-back]")){
    const nav = $("#nav");
    nav.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  }
});

/* ---------- 時間工具（釜山時間） ---------- */
function seoulNow(){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, time:`${p.hour==="24"?"00":p.hour}:${p.minute}`};
}
function dayInfo(dateStr){
  const d = new Date(dateStr+"T00:00:00+09:00");
  const idx = Math.round((d - new Date(D.trip.start+"T00:00:00+09:00"))/86400000);
  const [y,m,dd] = dateStr.split("-");
  return {md:`${+m}/${+dd}`, wk: WEEK[new Date(Date.UTC(+y,+m-1,+dd)).getUTCDay()], n: idx+1};
}

/* ---------- 總覽 ---------- */
function plane(){ return `<svg viewBox="0 0 56 20"><line x1="2" y1="10" x2="54" y2="10" stroke="#9aa8b6" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M24 4l10 6-10 6 2-6z" fill="#23406B"/></svg>`; }
function passHTML(f){
  return `<article class="pass">
    <div class="pass-head"><span>${esc(f.airline)}</span><span class="dir">${esc(f.dir)}</span></div>
    <div class="pass-body">
      <div><div class="code">${esc(f.from.code)}</div><div class="small muted">${esc(f.from.name)}</div><div class="time">${esc(f.from.time)}</div></div>
      <div class="pass-mid">${plane()}${esc(f.duration)}</div>
      <div class="right"><div class="code">${esc(f.to.code)}</div><div class="small muted">${esc(f.to.name)}</div><div class="time">${esc(f.to.time)}</div></div>
    </div>
    <div class="pass-cut"></div>
    <div class="pass-foot">
      <div><span>航班</span><b>${esc(f.no)}</b></div>
      <div><span>日期</span><b>${esc(f.from.date)}</b></div>
      <div><span>訂位代號</span><b>${esc(R(f.pnr))}</b></div>
      <div><span>出發航廈</span><b>${esc(f.from.terminal)}</b></div>
      <div><span>抵達航廈</span><b>${esc(f.to.terminal)}</b></div>
      <div><span>機型</span><b>${esc(f.aircraft)}</b></div>
    </div>
  </article>`;
}
function renderOverview(){
  const c = D.conference;
  $("#p-overview").innerHTML = `
    <div class="card" id="countCard"></div>
    <div class="card" id="lockCard"></div>
    <h2 class="sec-title">航班</h2>
    ${D.flights.map(passHTML).join("")}
    <h2 class="sec-title">研討會</h2>
    <div class="card">
      <h3 style="color:var(--port);font-size:19px">${esc(c.name)}・${esc(c.dates)}</h3>
      <p class="muted" style="margin:4px 0 0">${esc(c.venue)}</p>
      <div class="next-box" style="margin-top:10px">
        <b>我的發表 ${esc(c.talk.no)}</b>　${esc(c.talk.time)}<br>
        <span class="small">${esc(c.talk.session)}</span><br>
        <span class="small">${esc(c.talk.title)}</span><br>
        <span class="tag todo">待確認</span> <span class="small">${esc(c.talk.room)}</span>
      </div>
      <div class="btnrow">
        <a class="btn sm" href="${gmap("BPEX Busan Port International Exhibition Convention Center")}" target="_blank" rel="noopener">Google 地圖</a>
        <a class="btn sm" href="${nmap(c.venueKo)}" target="_blank" rel="noopener">Naver 地圖</a>
        <a class="btn sm" href="${esc(c.url)}" target="_blank" rel="noopener">研討會網站</a>
      </div>
    </div>
    ${backBtn}`;
  updateCount();
  renderLock();
}
function renderLock(){
  const el = $("#lockCard"); if(!el) return;
  if(S){
    el.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <span>🔓 <b>已解鎖</b><span class="small muted">　訂位代號與住宿地址已顯示</span></span>
      <button class="btn sm" id="lockBtn">重新上鎖</button></div>`;
  } else {
    el.innerHTML = `<b style="color:var(--port)">🔒 訂位代號、住宿地址已隱藏</b>
      <p class="small muted" style="margin:2px 0 0">同行的人輸入密碼即可查看，這台裝置會記住。</p>
      <form class="add" id="lockForm"><input type="password" id="pw" placeholder="輸入密碼" aria-label="密碼" autocomplete="current-password"><button class="btn solid" type="submit">解鎖</button></form>
      <p class="small" id="pwMsg" style="margin:4px 0 0;color:var(--fishcake)"></p>`;
  }
}
function rerenderAll(){ renderOverview(); renderDay(false); renderStay(); }
$("#p-overview").addEventListener("submit", async e => {
  if(e.target.id !== "lockForm") return; e.preventDefault();
  const pw = $("#pw").value;
  if(await unlock(pw)){ store.set("pw", pw); rerenderAll(); }
  else { $("#pwMsg").textContent = "密碼不對，請再試一次。"; }
});
$("#p-overview").addEventListener("click", e => {
  if(e.target.closest("#lockBtn")){ S = null; store.set("pw", null); rerenderAll(); }
});
function nextItem(now){
  for(const day of D.days){
    if(day.date < now.date) continue;
    for(const it of day.items){
      if(day.date > now.date || it.time > now.time) return {day, it};
    }
  }
  return null;
}
function updateCount(){
  const el = $("#countCard"); if(!el) return;
  const now = Date.now();
  const dep = new Date(D.trip.departAt).getTime();
  const ret = new Date(D.trip.returnAt).getTime();
  if(now < dep){
    let s = Math.floor((dep-now)/1000);
    const d = Math.floor(s/86400); s%=86400; const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60);
    el.innerHTML = `<b style="color:var(--port)">距離 ZE984 起飛還有</b>
      <div class="count"><div><b>${d}</b><span>天</span></div><div><b>${h}</b><span>小時</span></div><div><b>${m}</b><span>分鐘</span></div></div>
      <div class="next-box small">11/27（五）02:50 桃園 T1 起飛・建議 00:50 前到機場</div>`;
  } else if(now < ret){
    const t = seoulNow();
    const di = dayInfo(t.date);
    const nx = nextItem(t);
    el.innerHTML = `<b style="color:var(--port)">旅行進行中（釜山時間 ${t.time}）</b>
      <div class="count"><div><b>Day ${Math.min(Math.max(di.n,1),7)}</b><span>${di.md}（${di.wk}）</span></div></div>
      <div class="next-box"><b>下一個行程</b><br>${nx ? `${nx.day.date===t.date?"":dayInfo(nx.day.date).md+" "}${esc(nx.it.time)}　${esc(nx.it.title)}` : "今天的行程都完成了"}</div>`;
  } else {
    el.innerHTML = `<b style="color:var(--port)">旅程結束，歡迎回家！</b><p class="muted" style="margin:4px 0 0">發表辛苦了。</p>`;
  }
}

/* ---------- 天氣 ---------- */
let weather = null, weatherLive = false;
const WMO = c => c===0?["☀️","晴"]:c<=2?["🌤️","晴時多雲"]:c===3?["☁️","陰"]:c<=48?["🌫️","有霧"]:c<=67?["🌧️","下雨"]:c<=77?["❄️","下雪"]:c<=82?["🌦️","陣雨"]:["⛈️","雷雨"];
function wear(hi, lo, rain){
  let w = lo < 3 ? "羽絨外套＋圍巾手套" : lo < 8 ? "保暖外套＋毛衣，海邊風大加圍巾" : lo < 13 ? "薄外套＋長袖" : "長袖即可，備一件薄外套";
  if(rain >= 40) w += "；記得帶傘";
  return w;
}
async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${D.trip.lat}&longitude=${D.trip.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&start_date=${D.trip.start}&end_date=${D.trip.end}`;
  try{
    const r = await fetch(url); if(!r.ok) throw 0;
    const j = await r.json();
    weather = {};
    j.daily.time.forEach((t,i) => { weather[t] = {code:j.daily.weather_code[i], hi:Math.round(j.daily.temperature_2m_max[i]), lo:Math.round(j.daily.temperature_2m_min[i]), rain:j.daily.precipitation_probability_max[i] ?? 0}; });
    weatherLive = true;
  }catch(e){ weather = null; weatherLive = false; }
  if(!$("#p-days").hidden) renderSummary();
}

/* ---------- 每日行程 ---------- */
let curDay = store.get("day", 0);
let rainMode = store.get("rain", false);
let compact = store.get("compact", false);
const done = store.get("done", {});
const expenses = store.get("exp", {});
let rate = store.get("rate", D.defaultRate);
{ const t = seoulNow().date; const i = D.days.findIndex(d => d.date === t); if(i >= 0) curDay = i; }

function renderDaysShell(){
  $("#p-days").innerHTML = `
    <div class="days" role="tablist" aria-label="選擇日期">
      ${D.days.map((d,i) => { const f = dayInfo(d.date); return `<button class="day-btn" role="tab" data-day="${i}" aria-selected="${i===curDay}"><b>${f.md}</b><span>週${f.wk}・Day ${f.n}</span></button>`; }).join("")}
    </div>
    <div class="sticky"><div class="sum" id="sum"></div></div>
    <div class="mode" role="group" aria-label="晴雨模式">
      <button data-rain="0" aria-pressed="${!rainMode}">☀️ 晴天行程</button>
      <button data-rain="1" aria-pressed="${rainMode}">☔ 雨天備案</button>
    </div>
    <p class="small muted" style="margin:-4px 0 8px">交通可點上方按鈕切換地鐵／公車／計程車，選擇會記住。</p>
    <div id="dayBody"></div>
    <div class="card" id="expCard"></div>
    ${backBtn}`;
  $("#p-days").addEventListener("click", e => {
    const db = e.target.closest("[data-day]");
    if(db){ curDay = +db.dataset.day; store.set("day", curDay);
      document.querySelectorAll(".day-btn").forEach(b => b.setAttribute("aria-selected", +b.dataset.day===curDay));
      renderDay(true); return; }
    const rb = e.target.closest("[data-rain]");
    if(rb){ rainMode = rb.dataset.rain==="1"; store.set("rain", rainMode);
      document.querySelectorAll("[data-rain]").forEach(b => b.setAttribute("aria-pressed", (b.dataset.rain==="1")===rainMode));
      renderDay(false); return; }
    const ck = e.target.closest("[data-done]");
    if(ck){ const id = ck.dataset.done; done[id] = !done[id]; store.set("done", done);
      const card = ck.closest(".item"); card.classList.toggle("done", !!done[id]);
      ck.setAttribute("aria-pressed", !!done[id]); ck.querySelector(".lbl").textContent = done[id] ? "已完成" : "標記完成";
      ck.querySelector(".box").textContent = done[id] ? "✓" : ""; return; }
    const mt = e.target.closest("[data-mv]");
    if(mt){ const id = mt.dataset.mv; moveSel[id] = +mt.dataset.k; store.set("moveSel", moveSel);
      const box = document.getElementById("mv-"+id); const opts = moveById[id];
      if(box && opts){ const [m0, ...alt] = opts; box.outerHTML = moveHTML({...m0, alt}, id); }
      return; }
    if(e.target.closest("#sumToggle")){ compact = !compact; store.set("compact", compact); renderSummary(); return; }
    const xb = e.target.closest("[data-delexp]");
    if(xb){ const k = D.days[curDay].date; expenses[k].splice(+xb.dataset.delexp,1); store.set("exp", expenses); renderExp(); }
  });
}
function renderSummary(){
  const day = D.days[curDay];
  const live = weather && weather[day.date];
  const w = live || D.fallbackWeather;
  const [ic, txt] = WMO(w.code);
  const tonight = D.hotels.find(x => x.in <= day.date && day.date < x.out);
  const leaving = D.hotels.find(x => x.out === day.date);
  const h = tonight || leaving;
  const stayLabel = leaving && tonight ? `${leaving.name} 退房 → 今晚 ${tonight.name}` : leaving ? `今日退房：${leaving.name}` : `今晚：${h.name}`;
  $("#sum").className = "sum" + (compact ? " compact" : "");
  $("#sum").innerHTML = `
    <div class="wicon" aria-hidden="true">${ic}</div>
    <div><button class="sum-toggle" id="sumToggle">${compact?"展開 ▾":"收合 ▴"}</button>
      <span class="temps"><span class="hi">${w.hi}°</span> / <span class="lo">${w.lo}°</span></span>　${txt}　☔ ${w.rain}%</div>
    <div class="small muted">${live ? "Open-Meteo 即時預報" : "11 月底平均（參考）"}${weatherLive && !live ? "・此日尚無預報" : ""}　<a href="https://www.google.com/search?q=${encodeURIComponent("釜山 天氣 " + dayInfo(day.date).md)}" target="_blank" rel="noopener" style="font-weight:700">查即時預報 ↗</a></div>
    <div class="wear">👕 ${esc(wear(w.hi, w.lo, w.rain))}</div>
    <div class="hotel">🏨 <b>${esc(stayLabel)}</b>
      <span class="small muted">${esc(R(h.addr))}・${esc(h.station)} ${esc(h.walk)}</span>
      <a href="${gmap(R("@ADDRQ"))}" target="_blank" rel="noopener">Google 地圖</a>
      <a href="${nmap(R(h.addrKo))}" target="_blank" rel="noopener">Naver 地圖</a></div>`;
}
const moveSel = store.get("moveSel", {});
const moveById = {};
function moveHTML(m0, id){
  if(!m0) return "";
  const opts = [m0, ...(m0.alt || [])];
  moveById[id] = opts;
  let k = moveSel[id];
  if(k == null || !opts[k]){ k = opts.findIndex(o => (o.tag || "").startsWith("地鐵")); if(k < 0) k = 0; }
  const m = opts[k];
  const tabs = opts.length > 1 ? `<div class="mvtabs" role="group" aria-label="交通方式">${opts.map((o,i)=>`<button data-mv="${id}" data-k="${i}" aria-pressed="${i===k}">${esc(o.tag || o.mode)}</button>`).join("")}</div>` : "";
  const parts = [];
  parts.push(`<b>${esc(m.mode)}</b>${m.line ? `・${esc(m.line)}` : ""}`);
  parts.push(`${esc(m.from)} → ${esc(m.to)}　約 ${esc(m.mins).replace(/^約\s*/,"")}${m.dist ? `・${esc(m.dist)}` : ""}`);
  if(m.walk) parts.push(`<span class="walk">🚶 ${esc(m.walk)}</span>`);
  if(m.note) parts.push(`<span class="muted small">※ ${esc(m.note)}</span>`);
  return `<div class="move" id="mv-${id}"><div class="mv">${tabs}${parts.join("<br>")}</div></div>`;
}
function itemHTML(it, id, i){
  const alt = rainMode && it.rain;
  const title = alt ? it.rain.title : it.title;
  const ko = R(alt && it.rain.ko ? it.rain.ko : (it.ko || it.title));
  const q = R(alt && it.rain.ko ? it.rain.ko : (it.q || it.title + " 부산"));
  const rows = [];
  if(it.type==="spot" && it.stay) rows.push(["預計停留", it.stay]);
  if(it.type==="food"){ rows.push(["料理類型", it.cuisine], ["招牌菜色", it.dish], ["預算", it.budget], ["訂位", it.reserve]); }
  if(it.type==="shop"){ rows.push(["推薦商品", it.goods], ["退稅", it.tax], ["營業時間", it.hours]); }
  if(it.type==="conf" && it.stay) rows.push(["時間", it.stay]);
  const isDone = !!done[id];
  return `${moveHTML(it.move, id)}
  <article class="item ${it.type}${isDone?" done":""} anim-in" style="animation-delay:${i*60}ms">
    <div class="top"><div class="t">${esc(it.time)}</div>
      <div style="flex:1">
        <div class="kind">${TYPE[it.type]} ${it.who?`<span class="tag who">${esc(it.who)}</span>`:""} ${it.must?'<span class="tag must">必去</span>':""} ${it.sample?'<span class="tag sample">範例</span>':""} ${it.todo?'<span class="tag todo">待確認</span>':""} ${alt?'<span class="tag rain">雨天備案</span>':""}</div>
        <h3>${esc(title)}</h3>
      </div></div>
    ${alt ? `<p class="desc">${esc(it.rain.desc)}</p>` : (it.desc ? `<p class="desc">${esc(it.desc)}</p>` : "")}
    ${!alt && rows.length ? `<dl>${rows.filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>` : ""}
    ${it.todo ? `<p class="small" style="margin:6px 0 0">待確認：${esc(it.todo)}</p>` : ""}
    ${!rainMode && it.rain ? `<div class="rainbox">☔ 雨天備案：${esc(it.rain.title)}</div>` : ""}
    <div class="acts">
      <button class="chk" data-done="${id}" aria-pressed="${isDone}"><span class="box">${isDone?"✓":""}</span><span class="lbl">${isDone?"已完成":"標記完成"}</span></button>
      <a class="btn sm" href="${gmap(q)}" target="_blank" rel="noopener">📍 Google</a>
      <a class="btn sm" href="${nmap(ko)}" target="_blank" rel="noopener">📍 Naver</a>
    </div>
  </article>`;
}
function renderDay(animate){
  if(!$("#dayBody")) renderDaysShell();
  const day = D.days[curDay];
  const f = dayInfo(day.date);
  renderSummary();
  $("#dayBody").innerHTML = `
    <div class="day-head"><div class="muted small">Day ${f.n}・${f.md}（${f.wk}）</div><h2>${esc(day.title)}</h2></div>
    ${day.note ? `<div class="day-note">${esc(day.note)}</div>` : ""}
    <div class="tl">${day.items.map((it,i) => itemHTML(it, day.date+"_"+i, animate ? i : 0)).join("")}</div>`;
  if(!animate) document.querySelectorAll("#dayBody .anim-in").forEach(el => el.classList.remove("anim-in"));
  const btn = document.querySelector(`.day-btn[data-day="${curDay}"]`);
  if(btn) btn.scrollIntoView({block:"nearest", inline:"center"});
  renderExp();
}
function renderExp(){
  const day = D.days[curDay]; const k = day.date;
  const list = expenses[k] || [];
  const sum = list.reduce((a,b)=>a+b.krw,0);
  const all = Object.values(expenses).flat().reduce((a,b)=>a+b.krw,0);
  const twd = n => Math.round(n*rate).toLocaleString("zh-TW");
  $("#expCard").innerHTML = `
    <h3 style="color:var(--port)">💰 ${dayInfo(k).md} 花費紀錄</h3>
    <div class="rate"><label for="rate">匯率 1 韓元 =</label><input id="rate" type="number" step="0.0001" inputmode="decimal" value="${rate}"> 新台幣
      ${rate===D.defaultRate?'<span class="tag sample">範例匯率</span>':""}</div>
    <form class="exp-form" id="expForm">
      <input type="text" id="expDesc" placeholder="項目（例：午餐）" aria-label="項目">
      <input type="number" id="expAmt" placeholder="₩ 金額" inputmode="numeric" min="0" aria-label="韓元金額">
      <button class="btn solid" type="submit">加入</button>
    </form>
    <ul class="exp-list">${list.map((e,i)=>`<li><span>${esc(e.desc)}</span><span>₩${e.krw.toLocaleString("zh-TW")}</span><span class="muted small">≈ NT$${twd(e.krw)}</span><button class="x" data-delexp="${i}" aria-label="刪除">×</button></li>`).join("") || '<li class="muted small">還沒有紀錄</li>'}</ul>
    <div class="total"><span>今日合計</span><span>₩${sum.toLocaleString("zh-TW")}　≈ NT$${twd(sum)}</span></div>
    <div class="total small" style="color:var(--muted)"><span>全程累計</span><span>₩${all.toLocaleString("zh-TW")}　≈ NT$${twd(all)}</span></div>`;
  $("#rate").addEventListener("change", e => { const v = parseFloat(e.target.value); if(v>0){ rate = v; store.set("rate", rate); renderExp(); } });
  $("#expForm").addEventListener("submit", e => {
    e.preventDefault();
    const amt = parseInt($("#expAmt").value, 10); const desc = $("#expDesc").value.trim() || "花費";
    if(!(amt>0)) return;
    (expenses[k] = expenses[k] || []).push({desc, krw:amt}); store.set("exp", expenses); renderExp();
  });
}

/* ---------- 行前清單 ---------- */
let cl = store.get("checklist", null);
if(!cl){ cl = {}; for(const key of ["todo","pack"]) cl[key] = D.checklist[key].map(t => ({t, on:false})); }
function renderCheck(){
  const total = cl.todo.length + cl.pack.length;
  const on = [...cl.todo, ...cl.pack].filter(x=>x.on).length;
  const pct = total ? Math.round(on/total*100) : 0;
  const group = (key, name) => `
    <div class="card">
      <h3 style="color:var(--port)">${name}　<span class="small muted">${cl[key].filter(x=>x.on).length} / ${cl[key].length}</span></h3>
      <ul class="cl">${cl[key].map((x,i)=>`<li class="${x.on?"on":""}"><label><input type="checkbox" data-cl="${key}" data-i="${i}" ${x.on?"checked":""}><span>${esc(x.t)}</span></label><button class="x" data-cldel="${key}" data-i="${i}" aria-label="移除 ${esc(x.t)}">×</button></li>`).join("")}</ul>
      <form class="add" data-add="${key}"><input type="text" placeholder="新增項目" aria-label="新增${name}"><button class="btn solid" type="submit">新增</button></form>
    </div>`;
  $("#p-check").innerHTML = `
    <h2 class="sec-title">出發前準備</h2>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-weight:700"><span>整體進度</span><span>已完成 ${on} / ${total}（${pct}%）</span></div>
      <div class="prog" style="margin-top:8px"><i style="width:${pct}%"></i></div>
    </div>
    ${group("todo","行前待辦")}${group("pack","行李準備")}
    <button class="btn sm" id="clReset" style="margin-top:4px">恢復預設清單</button>
    ${backBtn}`;
}
$("#p-check").addEventListener("change", e => {
  const c = e.target.closest("[data-cl]"); if(!c) return;
  cl[c.dataset.cl][+c.dataset.i].on = c.checked; store.set("checklist", cl); renderCheck();
});
$("#p-check").addEventListener("click", e => {
  const d = e.target.closest("[data-cldel]");
  if(d){ cl[d.dataset.cldel].splice(+d.dataset.i,1); store.set("checklist", cl); renderCheck(); }
  if(e.target.closest("#clReset") && confirmReset()){ cl = null; store.set("checklist", null);
    cl = {}; for(const key of ["todo","pack"]) cl[key] = D.checklist[key].map(t => ({t, on:false})); renderCheck(); }
});
function confirmReset(){ const b = $("#clReset"); if(b.dataset.armed){ return true; } b.dataset.armed = 1; b.textContent = "再按一次確認恢復"; return false; }
$("#p-check").addEventListener("submit", e => {
  const f = e.target.closest("[data-add]"); if(!f) return; e.preventDefault();
  const v = f.querySelector("input").value.trim(); if(!v) return;
  cl[f.dataset.add].push({t:v, on:false}); store.set("checklist", cl); renderCheck();
});

/* ---------- 住宿速查 ---------- */
function renderStay(){
  const hotelCard = h => `
    <div class="card">
      <h3 style="color:var(--port);font-size:19px">${esc(h.name)}　<span class="small muted">${esc(h.type)}</span></h3>
      <p class="small muted" style="margin:2px 0 0">${esc(h.fullName)}</p>
      <dl class="kv">
        <dt>住宿期間</dt><dd><b>${esc(h.period)}</b></dd>
        <dt>地址</dt><dd>${esc(R(h.addr))}${S ? `<br><span class="small">${esc(R(h.addrKo))}</span>` : ""}</dd>
        <dt>最近車站</dt><dd>${esc(h.station)}</dd>
        <dt>步行時間</dt><dd>${esc(h.walk)}</dd>
        <dt>入住</dt><dd>${esc(h.checkin)}</dd>
        <dt>退房</dt><dd>${esc(h.checkout)}</dd>
        <dt>櫃台</dt><dd>${esc(h.desk)}</dd>
        <dt>訂房編號</dt><dd>${esc(R(h.bookingNo))} ${S && h.bookingSample?'<span class="tag sample">範例</span>':""}</dd>
      </dl>
      <ul class="small" style="margin:8px 0 0;padding-left:20px">${h.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
      <div class="btnrow">
        <a class="btn solid" href="${gmap(R("@ADDRQ"))}" target="_blank" rel="noopener">📍 Google 地圖</a>
        <a class="btn solid" href="${nmap(R(h.addrKo))}" target="_blank" rel="noopener">📍 Naver 地圖</a>
        <a class="btn" href="${esc(h.url)}" target="_blank" rel="noopener">Airbnb 頁面</a>
      </div>
    </div>`;
  $("#p-stay").innerHTML = `
    <h2 class="sec-title">住宿</h2>
    <div class="day-note">兩間在同一棟（Marant，釜山站步行約 3 分鐘）。12/2 早上 #24 退房、寄放行李，晚上入住 #19。</div>
    ${D.hotels.map(hotelCard).join("")}
    <h2 class="sec-title">伴手禮與退稅</h2>
    <div class="card small" style="font-size:15px">
      <b style="color:var(--port)">退稅提醒</b>
      <ul style="margin:4px 0 0;padding-left:20px">
        <li>店門口貼 Tax Free／Tax Refund 標誌才能退。</li>
        <li>單筆滿 ₩15,000 可辦，結帳時出示護照，多數可現場直接扣稅。</li>
        <li>沒有現場退的單據，12/3 在金海機場出境前辦理。</li>
        <li>即時退稅的金額上限以店家公告為準。</li>
      </ul>
    </div>
    ${D.areas.map(a=>`<div class="card area">
      <h3>${esc(a.name)}</h3>
      <ul>${a.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <p class="small" style="margin:6px 0 0">🧾 ${esc(a.tax)}</p>
      <div class="btnrow"><a class="btn sm" href="${gmap(a.ko+" 부산")}" target="_blank" rel="noopener">Google 地圖</a><a class="btn sm" href="${nmap(a.ko)}" target="_blank" rel="noopener">Naver 地圖</a></div>
    </div>`).join("")}
    <h2 class="sec-title">緊急與實用</h2>
    <div class="card">
      <dl class="kv">
        <dt>報警</dt><dd><a href="tel:112">112</a></dd>
        <dt>火警・救護</dt><dd><a href="tel:119">119</a></dd>
        <dt>觀光諮詢</dt><dd><a href="tel:1330">1330</a>（有中文服務）</dd>
        <dt>叫車</dt><dd>Kakao T、Uber</dd>
        <dt>地圖</dt><dd>Naver Map 的步行與大眾運輸路線最準</dd>
      </dl>
    </div>
    ${backBtn}`;
}

/* ---------- 啟動 ---------- */
renderOverview();
renderDaysShell();
renderDay(false);
renderCheck();
renderStay();
showTab(store.get("tab", "overview"));
loadWeather();
setInterval(updateCount, 30000);
(async () => { const pw = store.get("pw", null); if(pw && await unlock(pw)) rerenderAll(); })();
})();
</script>
